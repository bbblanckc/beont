<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Beont</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--bg:#F2F2F7;--card:#FFFFFF;--field:#EFEFF4;--label:#000000;--sec:#6C6C70;--sep:#D1D1D6;
--fill:#E5E5EA;--tint:#000000;--onTint:#FFFFFF;--danger:#D70015;--warnbg:#FFF4E5;--warn:#9A4A00;
--sheet:#F2F2F7;--shadow:0 1px 2px rgba(0,0,0,.06);
--study:#0040DD;--study-bg:#E5EEFF;--study-s:#007AFF;
--work:#8F4A00;--work-bg:#FFF0DB;--work-s:#FF9500;
--personal:#7A2BA6;--personal-bg:#F4E8FB;--personal-s:#AF52DE;
--friends:#1A6B2F;--friends-bg:#E2F6E7;--friends-s:#34C759;
--family:#B3122F;--family-bg:#FFE6EB;--family-s:#FF2D55;
--other:#3A3A3C;--other-bg:#E9E9ED;--other-s:#8E8E93;
--safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));
}
.dark{
--bg:#000000;--card:#1C1C1E;--field:#2C2C2E;--label:#FFFFFF;--sec:#98989F;--sep:#38383A;
--fill:#2C2C2E;--tint:#FFFFFF;--onTint:#000000;--danger:#FF6961;--warnbg:#3A2A10;--warn:#FFC266;
--sheet:#1C1C1E;--shadow:none;
--study:#7DB5FF;--study-bg:#132B4D;--study-s:#0A84FF;
--work:#FFC266;--work-bg:#3D2A0E;--work-s:#FF9F0A;
--personal:#DDA6F9;--personal-bg:#33203D;--personal-s:#BF5AF2;
--friends:#7BE596;--friends-bg:#163A20;--friends-s:#30D158;
--family:#FF8DA1;--family-bg:#40171F;--family-s:#FF375F;
--other:#D1D1D6;--other-bg:#2C2C2E;--other-s:#8E8E93;
}
.dark .sheet{--card:#2C2C2E;--field:#3A3A3C;--fill:#3A3A3C;--sep:#48484A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- home ---------- */
#app{min-height:100%;padding-bottom:calc(96px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0;height:52px}
.brand{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.045em;white-space:nowrap;display:flex;align-items:center}
.brand .ch{display:inline-block;overflow:hidden;white-space:pre;vertical-align:top;max-width:0;opacity:0;transform:translateY(45%);transition:max-width 460ms cubic-bezier(.2,.8,.2,1),opacity 320ms ease,transform 560ms cubic-bezier(.2,.8,.2,1)}
.brand .mute{color:var(--sec)}
.brand.open .ch{opacity:1;transform:none}
.iconbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--label)}
.iconbtn:active{background:var(--fill)}
.head{padding:4px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.02em}
.sub{padding:0 16px;color:var(--sec);font-size:15px;margin-top:2px}
.todaybtn{height:32px;padding:0 14px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:600;margin-bottom:5px}
.week{margin:14px 12px 4px;display:flex;align-items:center;gap:2px}
.week .arrow{width:32px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--sec);border-radius:10px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.day{height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.day .wd{font-size:12px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.02em}
.day .num{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.day.today .num{color:var(--tint);box-shadow:inset 0 0 0 1.5px var(--tint)}
.day.on .num{background:var(--tint);color:var(--onTint);box-shadow:none}
.day .dots{display:flex;gap:2px;height:5px}
.day .dots i{width:5px;height:5px;border-radius:3px;display:block}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.banner p{margin:0;flex:1;font-size:15px;line-height:20px}
.banner .b{height:34px;padding:0 14px;border-radius:17px;background:var(--tint);color:var(--onTint);font-size:15px;font-weight:600;white-space:nowrap}
.list{padding:10px 16px 0;display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:stretch}
.tcol{width:46px;flex:none;padding-top:14px;display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.tcol b{font-size:16px;font-weight:600}
.tcol span{font-size:13px;color:var(--sec);margin-top:2px}
.card{flex:1;min-width:0;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.card:active{opacity:.75}
.card .ttl{font-size:17px;font-weight:600;line-height:22px;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--sec);min-width:0}
.card .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:13px;font-weight:600;background:var(--c-bg);color:var(--c)}
.check{width:44px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:14px}
.check i{width:26px;height:26px;border-radius:13px;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center;color:transparent}
.item.done .check i{background:var(--c-s);border-color:var(--c-s);color:#fff}
.item.done .ttl{text-decoration:line-through;color:var(--sec)}
.item.past:not(.done) .card{opacity:.6}
.road{margin:6px 0;padding:8px 10px 8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:15px;line-height:19px;color:var(--label);border:1.5px dashed var(--sep)}
.road .txt{flex:1;min-width:0}
.road .txt b{display:block;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.road .txt small{display:block;font-size:13px;line-height:17px;color:var(--sec);margin-top:2px}
.road.warn{border:1.5px solid transparent;background:var(--warnbg);color:var(--warn)}
.road.warn .txt small{color:var(--warn)}
.road .go{height:36px;padding:0 12px 0 10px;border-radius:18px;background:var(--tint);color:var(--onTint);font-size:15px;font-weight:600;flex:none;display:flex;align-items:center;gap:5px}
.road .link{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.gap{height:10px}
.empty{margin:28px 16px 0;padding:28px 20px;border-radius:20px;background:var(--card);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow)}
.empty h2{margin:6px 0 0;font-size:20px;line-height:25px}
.empty p{margin:0;color:var(--sec);font-size:15px;line-height:21px;max-width:280px}
.fab{position:fixed;left:16px;right:16px;bottom:calc(14px + var(--safe-b));height:54px;border-radius:27px;background:var(--tint);color:var(--onTint);display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5}
.fab:active{transform:scale(.98)}
/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .28s ease;z-index:20}
.veil.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;top:10px;background:var(--sheet);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.9,.25,1);z-index:21;overflow:hidden}
.sheet.in{transform:none}
.sheet.small{top:auto;max-height:80%}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0;flex:none}
.bar{height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;flex:none}
.bar h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.bar .l{justify-self:start;height:44px;padding:0 8px;font-size:17px;color:var(--label)}
.bar .r{justify-self:end;height:44px;padding:0 8px;font-size:17px;font-weight:600}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
.foot{flex:none;padding:10px 16px calc(12px + var(--safe-b));background:var(--sheet)}
.primary{width:100%;height:52px;border-radius:14px;background:var(--tint);color:var(--onTint);font-size:17px;font-weight:600}
.primary:disabled{opacity:.35;cursor:default}
.sec-h{margin:22px 4px 8px;font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
.sec-h span{text-transform:none;letter-spacing:0;font-weight:400}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.titlein{width:100%;border:none;background:var(--card);border-radius:14px;padding:14px;font-size:20px;font-weight:600;outline:none;color:var(--label)}
.titlein:focus-visible{outline:none}
.titlein::placeholder{color:var(--sec);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--card);font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;box-shadow:inset 0 0 0 1px var(--sep)}
.chip.on{background:var(--tint);color:var(--onTint);box-shadow:none}
.cat{height:40px;padding:0 14px 0 10px;border-radius:20px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--card);color:var(--label);box-shadow:inset 0 0 0 1px var(--sep)}
.cat.on{background:var(--c-bg);color:var(--c);box-shadow:inset 0 0 0 2px var(--c-s)}
.se{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px 0}
.sebtn{min-height:66px;border-radius:14px;background:var(--field);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:8px 14px;text-align:left;min-width:0}
.sebtn small{font-size:13px;line-height:17px;color:var(--sec);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sebtn b{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sebtn.on{background:var(--card);box-shadow:inset 0 0 0 2px var(--tint)}
.wtip{text-align:center;font-size:13px;color:var(--sec);margin:6px 0 2px}
.cal{padding:4px 8px 6px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none;scroll-behavior:smooth}
.dstrip::-webkit-scrollbar{display:none}
.dpill{width:50px;height:60px;flex:none;border-radius:14px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.dpill small{font-size:12px;font-weight:600;color:var(--sec)}
.dpill b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.dpill.on{background:var(--tint);color:var(--onTint)}
.dpill.on small{color:var(--onTint);opacity:.8}
.dpill i{position:absolute;bottom:6px;width:4px;height:4px;border-radius:2px}
.dpill.more{width:auto;padding:0 12px;flex-direction:row;gap:6px;font-size:14px;font-weight:600}
.dmon{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 0;font-size:15px;font-weight:600}
.dmon button{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.calhead{display:flex;align-items:center;gap:6px;padding:8px 6px 6px}
.calhead b{flex:1;font-size:17px;font-weight:600}
.calhead .nav{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--label)}
.calhead .nav:active{background:var(--fill)}
.calhead .tb{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.calwd{font-size:12px;font-weight:600;color:var(--sec);text-align:center;padding:2px 0 4px;text-transform:uppercase}
.cday{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cday .n{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.cday.out .n{color:var(--sec);opacity:.5}
.cday.past .n{color:var(--sec)}
.cday.today .n{color:var(--tint);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--tint)}
.cday.on .n{background:var(--tint);color:var(--onTint);font-weight:700;box-shadow:none;opacity:1}
.cday .dots{display:flex;gap:2px;height:4px}
.cday .dots i{width:4px;height:4px;border-radius:2px;display:block}
.homecal{margin:12px 16px 4px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.headbtns{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.iconbtn.on{background:var(--fill);color:var(--label)}
.wheelwrap{position:relative;height:200px;margin:0 14px 14px;display:flex;justify-content:center;gap:4px}
.wheelwrap .band{position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:var(--field);pointer-events:none}
.wheelwrap .colon{position:relative;align-self:center;font-size:24px;font-weight:600;width:14px;text-align:center}
.wcol{position:relative;width:84px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);outline:none}
.wcol::-webkit-scrollbar{display:none}
.wcol .pad{height:80px}
.wcol button{display:block;width:100%;height:40px;scroll-snap-align:center;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--sec)}
.wcol button.act{color:var(--label);font-weight:600}
.wcol:focus-visible{outline:2px solid var(--tint);border-radius:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 14px;border-top:1px solid var(--sep);margin-top:10px}
.quick .chip{background:var(--field);box-shadow:none;height:34px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--sep)}
.row .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--field);flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .tx b{font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{font-size:14px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--sec)}
.row .x{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--sec)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px;border-radius:10px;background:var(--fill);margin:12px 14px 0}
.seg button{height:36px;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--label)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dark .seg button.on{background:#636366}
.roadbox{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.roadbig{display:flex;align-items:center;gap:12px}
.roadbig .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.roadbig .d{font-size:15px;color:var(--sec);line-height:20px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:36px;border-radius:10px;background:var(--field);font-size:17px;font-weight:600}
.stepper span{font-size:14px;color:var(--sec);flex:1}
.stepper .reset{width:auto;padding:0 10px;font-size:14px;background:none;text-decoration:underline;text-underline-offset:3px}
.note{width:100%;min-height:80px;border:none;outline:none;resize:vertical;background:var(--card);border-radius:14px;padding:12px 14px;font-size:17px;color:var(--label)}
.note::placeholder{color:var(--sec)}
.danger{width:100%;height:50px;border-radius:14px;background:var(--card);color:var(--danger);font-size:17px;font-weight:600;margin-top:22px}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--fill);margin-bottom:4px}
.search input{flex:1;border:none;background:none;outline:none;font-size:17px;color:var(--label);min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--sec)}
.hint{font-size:14px;color:var(--sec);padding:10px 4px;line-height:19px}
.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center;flex:none}
.radio.on{border-color:var(--tint)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--tint)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34C759}
.sw.on::after{transform:translateX(20px)}
.mono{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--field);font-weight:700;font-size:15px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);background:var(--tint);color:var(--onTint);padding:10px 16px;border-radius:20px;font-size:15px;font-weight:600;opacity:0;transition:all .25s ease;z-index:40;pointer-events:none;white-space:nowrap}
.toast.in{opacity:1;transform:translate(-50%,0)}
.spin{width:16px;height:16px;border-radius:8px;border:2px solid var(--sep);border-top-color:var(--label);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.foot-note{font-size:12px;color:var(--sec);text-align:center;margin-top:18px;line-height:17px}
@media (prefers-reduced-motion:reduce){.sheet,.veil,.brand .ch,.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layers"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var tg = (window.Telegram && window.Telegram.WebApp) || null;
var inTg = !!(tg && tg.initData);
/* ---------------- helpers ---------------- */
var pad = function(n){ return String(n).padStart(2,'0'); };
var dkey = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var kdate = function(k){ var p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
var addDays = function(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
var todayKey = function(){ return dkey(new Date()); };
var nowMin = function(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); };
var fmt = function(m){ m=((m%1440)+1440)%1440; return Math.floor(m/60)+':'+pad(m%60); };
var durTxt = function(m){ if(m<60) return m+' мин'; var h=Math.floor(m/60), r=m%60; return h+' ч'+(r?' '+r+' мин':''); };

/* ---------------- geo: search, routes ---------------- */
var routeCache={};
try{ routeCache=JSON.parse(lsGet('beont_routes')||'{}')||{}; }catch(e){ routeCache={}; }
function hav(a,b){
var R=6371, toR=Math.PI/180, dLa=(b.lat-a.lat)*toR, dLo=(b.lon-a.lon)*toR;
var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)*Math.sin(dLo/2);
return 2*R*Math.asin(Math.sqrt(x));
}
function estimate(from,to,mode,roadKm){
var km=roadKm||hav(from,to)*1.35;
if(mode==='walk') return Math.max(1,Math.round(km/4.7*60));
if(mode==='transit') return Math.max(5,Math.round(8+km/17*60));
return Math.max(2,Math.round(4+km/28*60));
}
function rKey(from,to,mode){ return mode+'|'+from.lat.toFixed(4)+','+from.lon.toFixed(4)+'|'+to.lat.toFixed(4)+','+to.lon.toFixed(4); }
var pending={};
function getRoute(from,to,mode,cb){
var k=rKey(from,to,mode);
if(routeCache[k]) return routeCache[k];
if(hav(from,to)<0.08){ routeCache[k]={min:1,approx:false}; return routeCache[k]; }
if(!pending[k]){
pending[k]=[];
var prof=(mode==='walk')?'routed-foot':'routed-car';
var url='https://routing.openstreetmap.de/'+prof+'/route/v1/driving/'+from.lon+','+from.lat+';'+to.lon+','+to.lat+'?overview=false';
var ctl=('AbortController' in window)?new AbortController():null;
var tm=setTimeout(function(){ if(ctl) ctl.abort(); },8000);
fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){ return r.json(); }).then(function(j){
clearTimeout(tm);
var rt=j&&j.routes&&j.routes[0]; if(!rt) throw new Error('no route');
var km=rt.distance/1000, min;
if(mode==='car') min=Math.max(2,Math.round(rt.duration/60*1.25+2));
else if(mode==='walk') min=Math.max(1,Math.round(rt.duration/60));
else min=estimate(from,to,'transit',km);
routeCache[k]={min:min,approx:mode==='transit',km:Math.round(km*10)/10};
}).catch(function(){
clearTimeout(tm);
routeCache[k]={min:estimate(from,to,mode),approx:true,fallback:true};
}).then(function(){
lsSet('beont_routes',JSON.stringify(routeCache));
var cbs=pending[k]; delete pending[k];
cbs.forEach(function(f){ try{ f(); }catch(e){} });
});
}
if(cb) pending[k].push(cb);
return null;
}
function fmtPlace(f){
var p=f.properties||{}, c=f.geometry&&f.geometry.coordinates;
if(!c) return null;
var street=[p.street,p.housenumber].filter(Boolean).join(', ');
var name=p.name||street||p.city||'Точка на карте';
var addrParts=[];
if(p.name&&street) addrParts.push(street);
if(p.district&&p.district!==name) addrParts.push(p.district);
if(p.city&&p.city!==name) addrParts.push(p.city);
else if(p.state&&!p.city) addrParts.push(p.state);
return {name:name,addr:addrParts.join(', '),lat:c[1],lon:c[0]};
}
var searchSeq=0, lastNom=0;
function normQ(q){
var s=' '+q+' ';
s=s.replace(/\s(г\.?|город)\s/gi,' ');
s=s.replace(/\s(д\.?|дом)\s*(?=\d)/gi,' ');
s=s.replace(/\sул\.?\s/gi,' улица ');
s=s.replace(/\s(пр-т|просп\.?)\s/gi,' проспект ');
s=s.replace(/\sпер\.?\s/gi,' переулок ');
s=s.replace(/\s(корп\.?|к\.)\s*(?=\d)/gi,' к');
return s.replace(/\s+/g,' ').trim();
}
function fmtNom(x){

var hn=a.house_number||'';

var city=a.city||a.town||a.village||a.hamlet||'';

function geoSearch(q,bias,cb){

if(num) out=out.filter(isEx).concat(out.filter(function(p){ return !isEx(p); }));

/* ---------------- day logic ---------------- */
function dayTasks(k){ return S.tasks.filter(function(t){ return t.date===k; }).sort(function(a,b){ return a.start-b.start||a.title.localeCompare(b.title); }); }
function originFor(task,list){
// nearest earlier task (same day) with a place, else home
var prev=null;
for(var i=0;i<list.length;i++){
var t=list[i]; if(t.id===task.id) continue;
if(t.start<task.start||(t.start===task.start&&false)){ if(t.place) prev=t; }
}
if(prev) return {kind:'prev',task:prev,place:prev.place,label:'после «'+prev.title+'»'};
if(S.settings.home) return {kind:'home',place:S.settings.home,label:'из дома'};
return null;
}
function travelInfo(task,list,onReady){
if(!task.place) return null;
var o=originFor(task,list);
if(!o) return {noOrigin:true};
var mode=task.mode||S.settings.mode;
var r;
if(task.manual!=null) r={min:task.manual,approx:false,manual:true};
else r=getRoute(o.place,task.place,mode,onReady);

function initWheel(col,idx,onChange){

setTimeout(function(){ setIdx(cur,false); },60);

var live=Math.round(col.scrollTop/H); mark(live);
clearTimeout(timer);
timer=setTimeout(function(){
var i=Math.max(0,Math.min(col.querySelectorAll('button').length-1,Math.round(col.scrollTop/H)));
if(i!==cur){ cur=i; hap('sel'); onChange(i); }
},90);

});

e.preventDefault(); var i=Math.max(0,Math.min(n-1,cur+(e.key==='ArrowDown'?1:-1)));

inner='<div class="roadbig">'+ic(tr.mode,24)+'<div><div class="n">'+(tr.approx?'≈ ':'')+durTxt(tr.min)+'</div><div class="d">Выйти в '+fmt(tr.leave)+' · '+esc(tr.origin.label)+(S.settings.buffer?' · запас '+S.settings.buffer+' мин':'')+'</div></div></div>'+
warn+
'<div class="stepper"><button data-act="tr" data-v="-5" aria-label="Дорога на 5 минут меньше">−5</button><button data-act="tr" data-v="5" aria-label="Дорога на 5 минут больше">+5</button>'+
'<span>'+(tr.manual?'Указано вручную':(tr.approx?'Примерно, по расстоянию':'По картам, с запасом на светофоры'))+'</span>'+
(tr.manual?'<button class="reset" data-act="trreset">Сбросить</button>':'')+'</div>';
}
el.innerHTML='<div class="sec-h">Дорога</div><div class="group">'+seg+'<div class="roadbox">'+inner+'</div></div>';
}
function saveDraft(){
if(!D||!D.title.trim()) return;
var t=JSON.parse(JSON.stringify(D)); var isNew=t._new; delete t._new; t.title=t.title.trim();
var i=S.tasks.findIndex(function(x){ return x.id===t.id; });
if(i>=0) S.tasks[i]=t; else S.tasks.push(t);
S.settings.lastCat=t.cat;
t.tmin=null; t.tfrom=null;
if(t.place){
var lst=dayTasks(t.date).filter(function(x){ return x.id!==t.id; }).concat([t]).sort(function(a,b){ return a.start-b.start; });
var o=originFor(t,lst), md=t.mode||S.settings.mode;
if(o){ var rr=getRoute(o.place,t.place,md); if(rr){ t.tmin=rr.min; t.tfrom=o.place.lat.toFixed(4)+','+o.place.lon.toFixed(4)+'|'+md; } }
}
saveTask(t); saveSettings();
S.sel=t.date;
closeSheet(); renderHome(); hap('ok');
if(isNew){ unfold(); toast('Добавлено: '+dayShort(t.date)+', '+fmt(t.start)); }
else toast('Сохранено');
}
/* ---------------- place picker ---------------- */
function openPlacePicker(target){
// target: 'task' | 'home'
var recent=[], seen={};
S.tasks.slice().reverse().forEach(function(t){ if(t.place){ var k=t.place.name+'|'+t.place.addr; if(!seen[k]&&recent.length<6){ seen[k]=1; recent.push(t.place); } } });
var html='<div class="bar"><button class="l" data-act="close">'+(target==='home'?'Отмена':'Назад')+'</button><h3>'+(target==='home'?'Где ты живёшь':'Место')+'</h3><span></span></div>'+
'<div class="scroll">'+
'<label class="search">'+ic('search',18)+'<span class="sr">Поиск адреса</span><input id="p-q" type="search" placeholder="Адрес или название места" autocomplete="off" enterkeyhint="search"></label>'+
'<div id="p-res"></div>'+
'<div class="group" style="margin-top:12px"><button class="row" data-act="myloc"><span class="ic">'+ic('locate',18)+'</span><span class="tx"><b>Моё местоположение</b><small>Возьму геопозицию из Телеграма</small></span></button>'+
(target!=='home'&&S.settings.home?'<button class="row" data-act="usehome"><span class="ic">'+ic('home',18)+'</span><span class="tx"><b>Дом</b><small>'+esc(S.settings.home.name)+'</small></span></button>':'')+
'</div>'+
(recent.length&&target!=='home'?'<div class="sec-h">Недавние</div><div class="group">'+recent.map(function(p,i){ return '<button class="row" data-act="recent" data-i="'+i+'"><span class="ic">'+ic('pin',18)+'</span><span class="tx"><b>'+esc(p.name)+'</b><small>'+esc(p.addr||'')+'</small></span></button>'; }).join('')+'</div>':'')+
'<p class="foot-note">Поиск адресов и маршруты: данные © участники OpenStreetMap</p>'+
'</div>';
var sh=openSheet(html);
sh._target=target; sh._recent=recent; sh._res=[];
var q=sh.querySelector('#p-q'), res=sh.querySelector('#p-res'), tmr=null;
var bias=S.settings.home||(recent[0])||null;
q.addEventListener('input',function(){
clearTimeout(tmr);
var v=q.value.trim();
if(v.length<3){ res.innerHTML=v.length?'<p class="hint">Продолжай вводить…</p>':''; return; }
res.innerHTML='<p class="hint" style="display:flex;gap:8px;align-items:center"><span class="spin"></span>Ищу…</p>';
tmr=setTimeout(function(){
geoSearch(v,bias,function(list,err,exact,num){
sh._res=list;
if(err){ res.innerHTML='<p class="hint">Не получилось найти: нет связи с поиском адресов. Попробуй ещё раз или выбери «Моё местоположение».</p>'; return; }
if(!list.length){ res.innerHTML='<p class="hint">Ничего не нашлось. Проверь улицу или напиши так: «Беломорская 5 Казань».</p>'; return; }
res.innerHTML=(exact?'':'<p class="hint">Дом '+esc(num)+' не отмечен на карте. Выбери улицу или соседний дом: дорога посчитается почти так же.</p>')+'<div class="group">'+list.map(function(p,i){ return '<button class="row" data-act="res" data-i="'+i+'"><span class="ic">'+ic('pin',18)+'</span><span class="tx"><b>'+esc(p.name)+'</b><small>'+esc(p.addr||'')+'</small></span></button>'; }).join('')+'</div>';
});
},380);
});
setTimeout(function(){ try{ q.focus({preventScroll:true}); }catch(e){} },420);
}
function placeChosen(p){
var sh=topSheet(); var target=sh&&sh._target;
closeSheet();
if(target==='home'){
S.settings.home=p; saveSettings(); hap('ok'); toast('Дом сохранён');
renderHome(); if(D) updRoad(); refreshSettings();
}else if(D){
D.place=p; D.manual=null; hap('sel'); updPlace();
}
}
/* ---------------- settings ---------------- */
function openSettings(){
var sh=openSheet('<div class="bar"><span></span><h3>Настройки</h3><button class="r" data-act="close">Готово</button></div><div class="scroll" id="set-body"></div>');
sh.id='settings';
refreshSettings();
}
function refreshSettings(){
var el=document.querySelector('#settings #set-body'); if(!el) return;
var s=S.settings;
var maps=MAPS.filter(function(m){ return !m.ios||isIOS; });
el.innerHTML=
'<div class="sec-h">Дом</div><div class="group">'+
(s.home?'<div class="row"><span class="ic">'+ic('home',18)+'</span><button class="tx" data-act="sethome" style="text-align:left"><b>'+esc(s.home.name)+'</b><small>'+esc(s.home.addr||'Изменить')+'</small></button><button class="x" data-act="nohome" aria-label="Убрать дом">'+ic('x',18)+'</button></div>'
:'<button class="row" data-act="sethome"><span class="ic">'+ic('home',18)+'</span><span class="tx"><b>Указать дом</b><small>Чтобы считать дорогу к первому делу</small></span><span class="chev">'+ic('right',18)+'</span></button>')+
'</div>'+
'<div class="sec-h">Открывать маршрут в</div><div class="group">'+maps.map(function(m){ var on=s.maps===m.id; return '<button class="row" data-act="maps" data-v="'+m.id+'" aria-pressed="'+on+'"><span class="mono">'+m.mono+'</span><span class="tx"><b>'+m.name+'</b></span><span class="radio'+(on?' on':'')+'"></span></button>'; }).join('')+'</div>'+
'<div class="sec-h">Как обычно добираешься</div><div class="group" style="padding-bottom:12px"><div class="seg">'+MODES.map(function(m){ var on=s.mode===m.id; return '<button class="'+(on?'on':'')+'" data-act="defmode" data-v="'+m.id+'" aria-pressed="'+on+'">'+ic(m.id,17)+m.name+'</button>'; }).join('')+'</div></div>'+
'<div class="sec-h">Запас времени на выход <span>сверху к дороге</span></div><div class="chips">'+[0,5,10,15].map(function(m){ var on=s.buffer===m; return '<button class="chip'+(on?' on':'')+'" data-act="buffer" data-v="'+m+'" aria-pressed="'+on+'">'+(m?m+' мин':'Без запаса')+'</button>'; }).join('')+'</div>'+
notifHTML()+
'<p class="foot-note">'+(server?'Дела синхронизируются с ботом и видны на всех твоих устройствах.':'Дела хранятся на этом устройстве. Открой Beont в Телеграме, чтобы они были на всех устройствах.')+'<br>Время в пути примерное и без пробок. Маршрут с пробками покажут карты.<br>Адреса и маршруты: © участники OpenStreetMap</p>';
}
function chipRow(act,opts,isOn){
return '<div class="chips">'+opts.map(function(o){ var on=isOn(o[0]); return '<button class="chip'+(on?' on':'')+'" data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>'; }).join('')+'</div>';
}
function notifHTML(){
var n=N();
var h='<div class="sec-h">Уведомления</div><div class="group"><button class="row" data-act="non" aria-pressed="'+!!n.on+'"><span class="ic">'+ic('bell',18)+'</span><span class="tx"><b>Напоминания от бота</b><small>'+(server?'Приходят в чат с ботом Beont':'Работают, когда Beont открыт в Телеграме')+'</small></span><span class="sw'+(n.on?' on':'')+'"></span></button></div>';
if(!n.on) return h;
h+='<div class="sec-h">Перед выходом <span>можно выбрать несколько</span></div>'+chipRow('nleave',[[60,'за 1 ч'],[30,'за 30 мин'],[15,'за 15 мин'],[5,'за 5 мин'],[0,'В момент выхода']],function(v){ return (n.leave||[]).indexOf(+v)>=0; });
h+='<p class="hint">Пример: «Через 30 мин выходить. Пара в 10:00, КФУ. Дорога 25 мин» и кнопка «Маршрут».</p>';
h+='<div class="sec-h">Дела без адреса</div>'+chipRow('nnp',[['','Не напоминать'],[5,'за 5 мин'],[10,'за 10 мин'],[15,'за 15 мин'],[30,'за 30 мин']],function(v){ return v===''?n.noPlace==null:n.noPlace===+v; });
h+='<div class="sec-h">План дня утром</div>'+chipRow('nmorn',[['','Выкл'],['07:00','7:00'],['07:30','7:30'],['08:00','8:00'],['09:00','9:00']],function(v){ return (n.morning||'')===v; });
h+='<div class="sec-h">План на завтра вечером</div>'+chipRow('nev',[['','Выкл'],['20:00','20:00'],['21:00','21:00'],['22:00','22:00']],function(v){ return (n.evening||'')===v; });
h+='<div class="sec-h">Тихие часы <span>бот молчит</span></div>'+chipRow('nquiet',[['','Выкл'],['23:00-07:00','23:00–7:00'],['00:00-08:00','0:00–8:00'],['22:00-08:00','22:00–8:00']],function(v){ return (n.quiet?n.quiet.join('-'):'')===v; });
h+='<p class="hint">Дела можно добавлять и сообщением боту, например: «завтра в 14 стоматолог, Беломорская 5».</p>';
return h;
}
function openMapPicker(task){
var maps=MAPS.filter(function(m){ return m.id!=='ask'&&(!m.ios||isIOS); });
var sh=openSheet('<div class="bar"><span></span><h3>Открыть маршрут</h3><button class="r" data-act="close">Отмена</button></div><div class="scroll"><div class="group">'+
maps.map(function(m){ return '<button class="row" data-act="openmap" data-v="'+m.id+'"><span class="mono">'+m.mono+'</span><span class="tx"><b>'+m.name+'</b></span><span class="chev">'+ic('right',18)+'</span></button>'; }).join('')+
'</div><p class="hint">Карты построят путь от того места, где ты сейчас.</p></div>',{small:true});
sh._task=task;
}
/* ---------------- events ---------------- */
document.addEventListener('click',function(e){
var b=e.target.closest('[data-act]'); if(!b) return;
var a=b.dataset.act, sh=topSheet();
switch(a){
case 'day': S.sel=b.dataset.k; hap('sel'); renderHome(); break;
case 'week': S.sel=dkey(addDays(kdate(S.sel),+b.dataset.d)); hap('sel'); renderHome(); break;
case 'today': S.sel=todayKey(); S.cm=null; hap('sel'); renderHome(); break;
case 'new': hap('light'); openEditor(null); break;
case 'edit': hap('light'); openEditor(S.tasks.find(function(x){ return x.id===b.dataset.id; })); break;
case 'done': {
var t=S.tasks.find(function(x){ return x.id===b.dataset.id; }); if(!t) break;
t.done=!t.done; saveTask(t); hap(t.done?'ok':'sel'); renderHome(); break;
}
case 'route': { var t2=S.tasks.find(function(x){ return x.id===b.dataset.id; }); if(t2) openRoute(t2); break; }
case 'settings': hap('light'); openSettings(); break;
case 'sethome': hap('light'); openPlacePicker('home'); break;
case 'nohome': S.settings.home=null; saveSettings(); refreshSettings(); renderHome(); break;
case 'close': closeSheet(); break;
case 'cat': D.cat=b.dataset.v; hap('sel'); updCats(); break;
case 'eday': { D.date=b.dataset.k; hap('sel'); var md=kdate(D.date); updDays(EXP&&md.getMonth()===CM.getMonth()?false:true); updTime(); updQuick(); updRoad(); break; }
case 'eexpand': EXP=true; hap('sel'); updDays(); break;
case 'ecollapse': EXP=false; hap('sel'); updDays(); break;
case 'emon': CM=addMonths(CM,+b.dataset.d); hap('sel'); updDays(false); break;
case 'etoday': D.date=todayKey(); hap('sel'); updDays(); updTime(); updQuick(); updRoad(); break;
case 'monthview': S.monthView=!S.monthView; S.cm=null; hap('sel'); renderHome(); break;
case 'hday': { S.sel=b.dataset.k; var hm=kdate(S.sel); if(S.cm&&hm.getMonth()!==S.cm.getMonth()) S.cm=null; hap('sel'); renderHome(); break; }
case 'hmon': S.cm=addMonths(S.cm||monthOf(S.sel),+b.dataset.d); hap('sel'); renderHome(); break;
case 'htoday': S.sel=todayKey(); S.cm=null; hap('sel'); renderHome(); break;
case 'dur': D.dur=+b.dataset.v; hap('sel'); updDurs(); updTime(); if(WM==='end') setWheels(); break;
case 'wm': WM=b.dataset.v; hap('sel'); updTime(); setWheels(); break;
case 'quick': { var q=quickOpts()[+b.dataset.i]; if(!q) break; D.date=q.k; D.start=q.s; WM='start'; hap('sel'); updDays(); updTime(); updQuick(); setWheels(); updRoad(); break; }
case 'pickplace': hap('light'); openPlacePicker('task'); break;
case 'noplace': D.place=null; D.manual=null; hap('sel'); updPlace(); break;
case 'mode': D.mode=b.dataset.v; D.manual=null; hap('sel'); updRoad(); break;
case 'tr': {
var list=dayTasks(D.date).filter(function(x){ return x.id!==D.id; }).concat([D]);
var cur=D.manual; if(cur==null){ var ti=travelInfo(D,list); cur=(ti&&ti.min)||15; }
D.manual=Math.max(0,Math.min(300,cur+(+b.dataset.v))); hap('sel'); updRoad(); break;
}
case 'trreset': D.manual=null; hap('sel'); updRoad(); break;
case 'save': saveDraft(); break;
case 'delete': {
var id=D.id;
confirmBox('Удалить это дело?',function(ok){
if(!ok) return;
S.tasks=S.tasks.filter(function(x){ return x.id!==id; }); delTask(id);
closeSheet(); renderHome(); hap('warn'); toast('Удалено');
});
break;
}
case 'res': placeChosen(sh._res[+b.dataset.i]); break;
case 'recent': placeChosen(sh._recent[+b.dataset.i]); break;
case 'usehome': placeChosen(S.settings.home); break;
case 'myloc': {
var row=b; row.querySelector('small').textContent='Определяю…';
myLocation(function(pos,err){
if(!pos){ row.querySelector('small').textContent=err||'Не получилось'; hap('warn'); return; }
reverse(pos.lat,pos.lon,function(p){ placeChosen(p); });
});
break;
}
case 'maps': S.settings.maps=b.dataset.v; saveSettings(); hap('sel'); refreshSettings(); break;
case 'defmode': S.settings.mode=b.dataset.v; saveSettings(); hap('sel'); refreshSettings(); renderHome(); break;
case 'buffer': S.settings.buffer=+b.dataset.v; saveSettings(); hap('sel'); refreshSettings(); renderHome(); break;
case 'non': N().on=!N().on; saveSettings(); hap('sel'); refreshSettings(); break;
case 'nleave': { var nl=N().leave||[], v=+b.dataset.v, ix=nl.indexOf(v); if(ix>=0) nl.splice(ix,1); else nl.push(v); nl.sort(function(a,b){ return b-a; }); N().leave=nl; saveSettings(); hap('sel'); refreshSettings(); break; }
case 'nnp': N().noPlace=b.dataset.v===''?null:+b.dataset.v; saveSettings(); hap('sel'); refreshSettings(); break;
case 'nmorn': N().morning=b.dataset.v||null; saveSettings(); hap('sel'); refreshSettings(); break;
case 'nev': N().evening=b.dataset.v||null; saveSettings(); hap('sel'); refreshSettings(); break;
case 'nquiet': N().quiet=b.dataset.v?b.dataset.v.split('-'):null; saveSettings(); hap('sel'); refreshSettings(); break;
case 'openmap': { var tk=sh._task; closeSheet(); openUrl(routeUrl(b.dataset.v,tk.place,tk.mode||S.settings.mode)); break; }
}
});
/* ---------------- theme & init ---------------- */
function applyTheme(){
var dark = tg && tg.colorScheme ? tg.colorScheme==='dark' : (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
if(/[?&]theme=dark/.test(location.search)) dark=true;
if(/[?&]theme=light/.test(location.search)) dark=false;
document.documentElement.classList.toggle('dark',!!dark);
var c=dark?'#000000':'#F2F2F7';
try{
if(inTg){
if(tg.setHeaderColor) tg.setHeaderColor(c);
if(tg.setBackgroundColor) tg.setBackgroundColor(c);
if(tg.setBottomBarColor && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor(c);
}
}catch(e){}
}
function init(){
applyTheme();
loadLocal();
renderHome();
if(tg){
try{ tg.ready(); }catch(e){}
if(inTg){
try{ tg.expand(); }catch(e){}
try{ if(tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); }catch(e){}
try{ tg.onEvent('themeChanged',function(){ applyTheme(); }); }catch(e){}
try{ tg.BackButton.onClick(function(){ closeSheet(); }); }catch(e){}
}
}
loadCloud(function(){
renderHome();
if(!server) return;
api('GET','/api/state').then(function(st){
if((!st.tasks||!st.tasks.length)&&S.tasks.length){
S.settings.tz=TZ;
return api('POST','/api/import',{tasks:S.tasks.map(slim),settings:S.settings});
}
S.tasks=st.tasks||[];
S.settings=Object.assign(S.settings,st.settings||{});
if(!S.settings.notif) S.settings.notif=defNotif();
if(S.settings.tz!==TZ) saveSettings();
cacheAll(); if(!S.stack.length) renderHome(); refreshSettings();
}).catch(function(e){ console.warn('state',e); });
});
// refresh "past" state and today rollover each minute
setInterval(function(){ if(!S.stack.length) renderHome(); },60000);
}
window.__beont={S:S,render:renderHome,routeCache:routeCache};
init();
})();
</script>
